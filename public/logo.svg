<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="tv-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect width="100" height="100" rx="24" fill="#091410" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" stroke="#1f3d32" stroke-width="1.5" />
  
  <!-- Subtle Radar grid rings -->
  <circle cx="50" cy="50" r="36" stroke="#133527" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="50" cy="50" r="24" stroke="#174431" stroke-width="1" />
  <circle cx="50" cy="50" r="12" stroke="#1f5840" stroke-width="1" stroke-dasharray="1 3" />
  
  <!-- Pulse Wave Signals (Listening to the Earth) -->
  <path d="M18 50 C26 50, 30 32, 38 32 C44 32, 46 68, 52 68 C58 68, 62 40, 68 40 C74 40, 78 50, 82 50" 
        stroke="url(#tv-glow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Stylized Earth V (VOX / Signal Crest) -->
  <path d="M34 26 L50 74 L66 26" 
        stroke="url(#tv-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Center Core Beacon -->
  <circle cx="50" cy="50" r="4.5" fill="#a3e635" />
  <circle cx="50" cy="50" r="7.5" stroke="#84cc16" stroke-width="1" opacity="0.6" />
</svg>
